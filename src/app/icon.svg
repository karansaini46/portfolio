<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0b"/>
      <stop offset="100%" stop-color="#070706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45f35"/>
      <stop offset="100%" stop-color="#d0b578"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="104" ry="104" fill="none" stroke="rgba(236,233,225,0.1)" stroke-width="4"/>
  <!-- Terminal prompt chevron > -->
  <path d="M140 160 L280 256 L140 352" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor line _ -->
  <line x1="310" y1="352" x2="400" y2="352" stroke="#ece9e1" stroke-width="36" stroke-linecap="round" opacity="0.85"/>
</svg>
